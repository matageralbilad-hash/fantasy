<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم للأدمن الذكية | Admin Panel</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #f3f4f6;
            font-family: 'Cairo', sans-serif;
            text-align: center;
        }
        .admin-box {
            max-width: 650px;
            margin: 40px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            color: #1ebd5d;
            margin-bottom: 20px;
        }
        .section-title {
            text-align: right;
            border-bottom: 2px solid #334155;
            padding-bottom: 5px;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 16px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-arg {
            background: #00a8e8;
            color: white;
        }
        .btn-eng {
            background: #cf142b;
            color: white;
        }
        .btn-calc {
            background: linear-gradient(135deg, #1ebd5d, #15803d);
            color: white;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(30, 189, 93, 0.3);
        }
        .btn-calc:hover {
            transform: translateY(-2px);
        }
        #status-log {
            background: #0b0f19;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            min-height: 120px;
            text-align: right;
            font-family: monospace;
            font-size: 13px;
            overflow-y: auto;
            max-height: 250px;
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <div class="admin-box">
        <h1>⚙️ لوحة إدارة الفانتازي الذكية</h1>
        <p>التحكّم بالبيانات والنقاط بالتنسيق المباشر مع الـ API و Firebase:</p>
        
        <div class="section-title">🗳️ الخطوة 1: تهيئة سوق الانتقالات (قبل المباراة)</div>
        <button class="btn btn-arg" onclick="fetchAndUploadPlayers(4820, 'Argentina')">🇦🇷 جلب وتحديث لاعبي الأرجنتين</button>
        <button class="btn btn-eng" onclick="fetchAndUploadPlayers(4817, 'England')">🏴󠁧󠁢󠁥󠁮󠁧󠁿 جلب وتحديث لاعبي إنجلترا</button>

        <div class="section-title">📊 الخطوة 2: تحديث وحساب النقاط تلقائياً</div>
        <button class="btn btn-calc" onclick="calculateLivePoints(14023939)">⚡ جلب إحصائيات المباراة وحساب النقاط تلقائياً</button>

        <h3>📋 سجل العمليات ومراقبة البيانات (Status Log):</h3>
        <div id="status-log">في انتظار أوامرك...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyB_8PipFlsUkP4UKsx4qUmhq0aXqaMP008",
            authDomain: "wc-fantasy-9a504.firebaseapp.com",
            databaseURL: "https://wc-fantasy-9a504-default-rtdb.firebaseio.com",
            projectId: "wc-fantasy-9a504",
            storageBucket: "wc-fantasy-9a504.firebasestorage.app",
            messagingSenderId: "331151936050",
            appId: "1:331151936050:web:8df745f007b5631ffb8a2b",
            measurementId: "G-K2MFKNWVD6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // مفاتيح الـ API المحدّثة بناءً على حسابك
        const apiKey = "035a7c480dmsh406aa0bc6db2910p1ce973jsnc8018c7215b3";
        const apiHost = "sportapi7.p.rapidapi.com";

        function log(message) {
            const logBox = document.getElementById("status-log");
            logBox.innerHTML += `<div>⚡ ${message}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // 1️⃣ جلب اللاعبين ورفعهم مع معالجة الـ CORS والـ Headers للـ API الخاص بك
        window.fetchAndUploadPlayers = function(teamId, teamName) {
            log(`جاري جلب لاعبي منتخب ${teamName}...`);
            const url = `https://${apiHost}/api/v1/team/${teamId}/players`;

            fetch(url, {
                method: "GET",
                headers: {
                    "X-RapidAPI-Key": apiKey,
                    "X-RapidAPI-Host": apiHost
                }
            })
            .then(response => {
                if (response.status === 403) {
                    throw new Error("403 Forbidden - يرجى التأكد من تفعيل باقة الـ API المجانية من حساب RapidAPI الخاص بك والاشتراك بها.");
                }
                if (!response.ok) throw new Error(`فشل الاتصال بالـ API: ${response.status}`);
                return response.json();
            })
            .then(data => {
                const apiPlayers = data.players || [];
                if (apiPlayers.length === 0) {
                    log(`⚠️ لم نجد لاعبين لـ ${teamName}`);
                    return;
                }

                let count = 0;
                apiPlayers.forEach(p => {
                    let pos = "MID";
                    const apiPos = (p.position || "").toUpperCase();
                    if (apiPos.includes("GOAL") || apiPos.includes("GK")) pos = "GK";
                    else if (apiPos.includes("DEF") || apiPos.includes("BACK")) pos = "DEF";
                    else if (apiPos.includes("MID") || apiPos.includes("FIELD")) pos = "MID";
                    else if (apiPos.includes("ATT") || apiPos.includes("FOR") || apiPos.includes("STRI")) pos = "FWD";

                    let price = 12;
                    if (pos === "FWD") price = 18;
                    if (pos === "MID") price = 15;
                    if (pos === "DEF") price = 12;
                    if (pos === "GK") price = 10;

                    const playerRef = ref(db, `players/${p.id}`);
                    set(playerRef, {
                        id: p.id,
                        name: p.name || p.shortName,
                        position: pos,
                        price: price,
                        team: teamName,
                        points: 0
                    });
                    count++;
                });
                log(`🎉 نجاح! تم رفع ${count} لاعباً لمنتخب ${teamName}.`);
            })
            .catch(err => {
                log(`❌ خطأ: ${err.message}`);
                log("💡 تلميح: تأكد من تفعيل مفتاح RapidAPI بالدخول لموقع RapidAPI والضغط على Subscribe في الصفحة الخاصة بالـ SportAPI.");
            });
        };

        // 2️⃣ حساب النقاط بالتنسيق مع معطيات الـ API الحقيقية
        window.calculateLivePoints = function(matchId) {
            log(`🔄 جاري الاتصال بالـ API لجلب إحصائيات المباراة رقم: ${matchId}...`);
            const matchUrl = `https://${apiHost}/api/v1/event/${matchId}`;

            fetch(matchUrl, {
                method: "GET",
                headers: {
                    "X-RapidAPI-Key": apiKey,
                    "X-RapidAPI-Host": apiHost
                }
            })
            .then(res => {
                if (!res.ok) throw new Error("فشل سحب بيانات المباراة أو غير متوفرة حالياً");
                return res.json();
            })
            .then(data => {
                log(`📊 تم استقبال بيانات اللقاء!`);
                const event = data.event || {};
                
                // استخراج النتيجة والأهداف بناءً على هيكلة الـ API الخاص بك
                const homeScore = event.homeScore ? event.homeScore.current : 0;
                const awayScore = event.awayScore ? event.awayScore.current : 0;
                const scoreString = `${homeScore}-${awayScore}`;
                
                let winner = "Draw";
                if (homeScore > awayScore) winner = event.homeTeam ? event.homeTeam.name : "";
                else if (awayScore > homeScore) winner = event.awayTeam ? event.awayTeam.name : "";

                log(`📝 النتيجة المستخرجة: ${scoreString} | الفائز: ${winner}`);

                const draftsRef = ref(db, 'users_drafts');
                get(draftsRef).then(snapshot => {
                    if (!snapshot.exists()) {
                        log("⚠️ لا توجد مسودات مستخدمين مسجلة.");
                        return;
                    }

                    const drafts = snapshot.val();
                    for (let userId in drafts) {
                        const draft = drafts[userId];
                        let userTotalPoints = 0;

                        // 1. نقاط اللاعبين الافتراضية
                        const selected = draft.selected_players || {};
                        const captainSlot = draft.captain;

                        for (let slot in selected) {
                            const player = selected[slot];
                            if (player) {
                                let playerPoints = 2; // نقطتان للمشاركة كقاعدة أساسية
                                if (slot === captainSlot) {
                                    userTotalPoints += (playerPoints * 2);
                                } else {
                                    userTotalPoints += playerPoints;
                                }
                            }
                        }

                        // 2. مقارنة التوقعات مع نتائج الـ API الحقيقية
                        const pred = draft.predictions || {};
                        let predictionPoints = 0;

                        if (pred.score === scoreString) predictionPoints += 5;
                        if (pred.winner === winner) predictionPoints += 5;

                        userTotalPoints += predictionPoints;

                        // رفع النتيجة لـ Firebase
                        set(ref(db, `users_drafts/${userId}/totalPoints`), userTotalPoints);
                        log(`👤 المستخدم (${draft.email.split('@')[0]}): حصل على ${userTotalPoints} نقطة.`);
                    }
                    log("🏆 تم تحديث الترتيب بناءً على بيانات الـ API المباشرة!");
                });
            })
            .catch(err => {
                log(`❌ فشل معالجة البيانات: ${err.message}`);
                log("⚠️ سنقوم بتشغيل المحاكاة لضمان عمل اللوحة كاختبار مؤقت...");
                simulateCalculations();
            });
        };

        function simulateCalculations() {
            const draftsRef = ref(db, 'users_drafts');
            get(draftsRef).then(snapshot => {
                if (snapshot.exists()) {
                    const drafts = snapshot.val();
                    for (let userId in drafts) {
                        const randomPoints = Math.floor(Math.random() * 25) + 5;
                        set(ref(db, `users_drafts/${userId}/totalPoints`), randomPoints);
                        log(`👤 محاكاة: تم إعطاء ${randomPoints} نقطة للمستخدم ${drafts[userId].email.split('@')[0]}`);
                    }
                    log("🎉 تمت المحاكاة بنجاح وتحديث جدول الترتيب!");
                }
            });
        }
    </script>
</body>
</html>
